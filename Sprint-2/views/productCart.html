<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soberano Distrito Barber - Carrito</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body style="background-color: rgba(0,0,0,0.8);">

    <div class="modal-overlay">
        <div class="modal-container" style="max-width: 600px;">
            <a href="/" class="modal-close" style="text-decoration: none;">&times;</a>
            <span style="font-size: 0.75rem; letter-spacing: 2px; color: #9e2a2b; text-transform: uppercase;">— Tu Selección</span>
            
            <h2 style="font-size: 2.2rem; margin-top: 5px; margin-bottom: 30px; font-weight: normal;">Carrito</h2>

            <!-- Elemento de producto en el carrito -->
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d1c7bd; padding-bottom: 20px; margin-bottom: 20px;">
                <div>
                    <span style="font-size: 0.7rem; color: #666; text-transform: uppercase;">Afeitado</span>
                    <h4 style="margin: 5px 0; font-size: 1.1rem;">Crema de Afeitado N·01</h4>
                    <span style="font-weight: bold;">10 €</span>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button style="padding: 5px 10px; background: none; border: 1px solid #999; cursor: pointer;">-</button>
                    <span>1</span>
                    <button style="padding: 5px 10px; background: none; border: 1px solid #999; cursor: pointer;">+</button>
                </div>
            </div>

            <!-- Total -->
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; font-weight: bold; margin-bottom: 30px;">
                <span>Total</span>
                <span>10 €</span>
            </div>

            <button class="btn-primary">Finalizar Compra</button>
        </div>
    </div>

</body>
</html>
